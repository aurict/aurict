name: CI

on:
  push:
    branches: [main, develop]
  # Every PR runs every gate: the "CI OK" job below is the single required check, and
  # path filters would leave PRs that only touch some apps without a required result.
  pull_request:
    branches: [main]

permissions:
  contents: read

# Aynı branch'te yeni push gelince eskiyi iptal et
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Hızlı tip kontrolü — her push'ta çalışır (~30s) ───────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check repository quality contracts
        run: bun run check:quality

      - name: Typecheck core
        run: bunx tsc -p packages/core/tsconfig.json --noEmit

      - name: Typecheck cli
        run: bunx tsc -p packages/cli/tsconfig.json --noEmit

      - name: Typecheck desktop
        run: bunx tsc -p apps/desktop/tsconfig.json --noEmit

  # ── 2. Test suite — her push'ta çalışır ──────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # runner.temp'i step içinde shell env var olarak set et (job env'de runner context çalışmıyor)
      - name: Set temp dirs
        run: |
          mkdir -p "$RUNNER_TEMP/aurict-core"
          mkdir -p "$RUNNER_TEMP/aurict-remote"
          mkdir -p "$RUNNER_TEMP/aurict-snapshots"
          echo "AURICT_STATE_DIR=$RUNNER_TEMP/aurict-core" >> "$GITHUB_ENV"
          echo "AURICT_REMOTE_STATE_DIR=$RUNNER_TEMP/aurict-remote" >> "$GITHUB_ENV"
          echo "AURICT_SNAPSHOT_DIR=$RUNNER_TEMP/aurict-snapshots" >> "$GITHUB_ENV"

      - name: Prepare test reports
        run: mkdir -p reports/test

      - name: Run core tests
        run: bun run test:core --randomize --seed=20260807 --reporter=junit --reporter-outfile=reports/test/core.xml

      - name: Run cli tests
        run: bun run test:cli --randomize --seed=20260807 --reporter=junit --reporter-outfile=reports/test/cli.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: reports/test/*.xml
          if-no-files-found: error

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run core coverage gate
        run: bun run scripts/test.ts core --coverage --coverage-reporter=lcov --coverage-dir=reports/coverage/core

      - name: Run CLI coverage gate
        run: bun run scripts/test.ts cli --coverage --coverage-reporter=lcov --coverage-dir=reports/coverage/cli

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: reports/coverage/**/lcov.info
          if-no-files-found: error

  # ── 3. Binary build + smoke — sadece main veya PR'da çalışır ────────────
  build:
    name: Build & Smoke
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [typecheck, test, coverage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build platform binaries
        run: bun run scripts/build-all.ts

      - name: Verify curl installer
        run: |
          bash -n apps/web/public/install.sh
          bun run scripts/test-install.ts

      - name: Smoke test linux binary
        run: ./dist/aurict-linux-x64 --version

      - name: Smoke test compiled worker bootstrap
        run: bun run check:worker

      - name: Verify package and binary version contract
        run: bun run scripts/check-version-consistency.ts --binary dist/aurict-linux-x64

      - name: Dry-run npm wrapper packages
        run: |
          cd packages/cli && npm pack --dry-run
          cd ../aurict && npm pack --dry-run

  desktop:
    name: Desktop quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint desktop
        run: bun run --cwd apps/desktop lint

      - name: Test desktop
        run: bun run --cwd apps/desktop test

      - name: Package Debian desktop smoke artifact
        env:
          AURICT_SIDECAR_TARGET: bun-linux-x64
        run: bun run --cwd apps/desktop make -- --targets @electron-forge/maker-deb

      - name: Inspect Debian package metadata
        run: dpkg-deb -f apps/desktop/out/make/deb/x64/hoprel_*.deb Package Version Architecture

  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint web
        run: bun run --cwd apps/web lint

      - name: Test web
        run: bun test apps/web/test

      - name: Build web
        run: bun run --cwd apps/web build

  mobile:
    name: Mobile quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Flutter 3.50 deprecates package:flutter/material.dart; stay on the last green
          # release until mobile/ moves to package:material_ui.
          flutter-version: 3.47.9
          cache: true

      - name: Install mobile dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze mobile
        working-directory: mobile
        run: flutter analyze

      - name: Test mobile
        working-directory: mobile
        run: flutter test

  sites:
    name: Site quality gate (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Standalone apps with their own lockfile (not root workspace members).
        app: [mobile-web, decision-web, quaera-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # These lockfiles are written by Bun 1.4 (lockfileVersion 2), which Bun 1.3 cannot
          # read. The sites ship as Node containers, so this does not affect the CLI binaries.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_DB: aurict_test
          POSTGRES_USER: aurict
          POSTGRES_PASSWORD: aurict-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aurict -d aurict_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://aurict:aurict-ci-only@localhost:5432/aurict_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations
        run: bun run db:migrate

      - name: Test (unit, integration, Redis)
        run: bun test

      - name: Build image
        working-directory: .
        run: docker build -f apps/backend/Dockerfile -t aurict-backend:ci .

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck, test, coverage, build, desktop, web, mobile, sites, backend]
    steps:
      - name: Require every gate to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "A required gate did not pass ($r)." >&2; exit 1 ;;
            esac
          done
