name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/**"
      - "apps/desktop/**"
      - "apps/web/**"
      - "mobile/**"
      - "scripts/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/desktop/**"
      - "apps/web/**"
      - "mobile/**"
      - "scripts/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/ci.yml"

# Aynı branch'te yeni push gelince eskiyi iptal et
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Hızlı tip kontrolü — her push'ta çalışır (~30s) ───────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check repository quality contracts
        run: bun run check:quality

      - name: Typecheck core
        run: bunx tsc -p packages/core/tsconfig.json --noEmit

      - name: Typecheck cli
        run: bunx tsc -p packages/cli/tsconfig.json --noEmit

      - name: Typecheck desktop
        run: bunx tsc -p apps/desktop/tsconfig.json --noEmit

  # ── 2. Test suite — her push'ta çalışır ──────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # runner.temp'i step içinde shell env var olarak set et (job env'de runner context çalışmıyor)
      - name: Set temp dirs
        run: |
          mkdir -p "$RUNNER_TEMP/aurict-core"
          mkdir -p "$RUNNER_TEMP/aurict-remote"
          mkdir -p "$RUNNER_TEMP/aurict-snapshots"
          echo "AURICT_STATE_DIR=$RUNNER_TEMP/aurict-core" >> "$GITHUB_ENV"
          echo "AURICT_REMOTE_STATE_DIR=$RUNNER_TEMP/aurict-remote" >> "$GITHUB_ENV"
          echo "AURICT_SNAPSHOT_DIR=$RUNNER_TEMP/aurict-snapshots" >> "$GITHUB_ENV"

      - name: Prepare test reports
        run: mkdir -p reports/test

      - name: Run core tests
        run: bun run test:core --randomize --seed=20260807 --reporter=junit --reporter-outfile=reports/test/core.xml

      - name: Run cli tests
        run: bun run test:cli --randomize --seed=20260807 --reporter=junit --reporter-outfile=reports/test/cli.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/test/*.xml
          if-no-files-found: error

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run core coverage gate
        run: bun run scripts/test.ts core --coverage --coverage-reporter=lcov --coverage-dir=reports/coverage/core

      - name: Run CLI coverage gate
        run: bun run scripts/test.ts cli --coverage --coverage-reporter=lcov --coverage-dir=reports/coverage/cli

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: reports/coverage/**/lcov.info
          if-no-files-found: error

  # ── 3. Binary build + smoke — sadece main veya PR'da çalışır ────────────
  build:
    name: Build & Smoke
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [typecheck, test, coverage]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build platform binaries
        run: bun run scripts/build-all.ts

      - name: Verify curl installer
        run: |
          bash -n apps/web/public/install.sh
          bun run scripts/test-install.ts

      - name: Smoke test linux binary
        run: ./dist/aurict-linux-x64 --version

      - name: Smoke test compiled worker bootstrap
        run: bun run check:worker

      - name: Verify package and binary version contract
        run: bun run scripts/check-version-consistency.ts --binary dist/aurict-linux-x64

      - name: Dry-run npm wrapper packages
        run: |
          cd packages/cli && npm pack --dry-run
          cd ../aurict && npm pack --dry-run

  desktop:
    name: Desktop quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint desktop
        run: bun run --cwd apps/desktop lint

      - name: Test desktop
        run: bun run --cwd apps/desktop test

      - name: Package Debian desktop smoke artifact
        env:
          AURICT_SIDECAR_TARGET: bun-linux-x64
        run: bun run --cwd apps/desktop make -- --targets @electron-forge/maker-deb

      - name: Inspect Debian package metadata
        run: dpkg-deb -f apps/desktop/out/make/deb/x64/hoprel_*.deb Package Version Architecture

  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint web
        run: bun run --cwd apps/web lint

      - name: Build web
        run: bun run --cwd apps/web build

  mobile:
    name: Mobile quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install mobile dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze mobile
        working-directory: mobile
        run: flutter analyze

      - name: Test mobile
        working-directory: mobile
        run: flutter test
