name: Deploy

# Promotes a build to production. The server never accepts a connection from CI: it polls the
# "production" tag of each image and runs a new digest only after verifying its build
# attestation (deploy/aurict/bin/aurict-deploy). This workflow just moves that tag, and it can
# only do so through the "production" environment (required reviewer, main branch only).
#
# Runs after "Images" succeeds on main, or by hand for a chosen commit (e.g. a rollback).
on:
  workflow_run:
    workflows: [Images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Full commit SHA on main whose images to release (default: latest main)"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  promote:
    name: Release to production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Pick the commit
        id: commit
        env:
          INPUT_COMMIT: ${{ github.event.inputs.commit }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_COMMIT:-${RUN_SHA:-$FALLBACK_SHA}}"
          if ! printf '%s' "$sha" | grep -Eqx '[0-9a-f]{40}'; then
            echo "Commit must be a full 40-character SHA, got '$sha'." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and tag the images
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          services=(backend web mobile-web decision-web quaera-web)
          declare -A digests
          # Verify every image first, then move all tags back to back, so the server never sees a
          # release where some services are new and others are not yet verified.
          for service in "${services[@]}"; do
            image="ghcr.io/${OWNER}/aurict-${service}"
            digest=$(docker buildx imagetools inspect "${image}:sha-${SHA}" --format '{{json .Manifest}}' | jq -r .digest)
            # The same check the server runs; failing here stops a bad tag from ever being set.
            gh attestation verify "oci://${image}@${digest}" --repo "$REPO" \
              --signer-workflow "${REPO}/.github/workflows/images.yml" --source-ref refs/heads/main \
              --deny-self-hosted-runners
            digests[$service]="$digest"
          done
          for service in "${services[@]}"; do
            image="ghcr.io/${OWNER}/aurict-${service}"
            docker buildx imagetools create -t "${image}:production" "${image}@${digests[$service]}"
            echo "${service}: ${image}@${digests[$service]}" >> "$GITHUB_STEP_SUMMARY"
          done
