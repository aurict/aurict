name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.3)"
        required: true
        default: "1.0.3"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build-non-macos:
    name: Build non-macOS binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build non-macOS binaries
        run: |
          bun run scripts/build-all.ts linux-x64
          bun run scripts/build-all.ts linux-arm64
          bun run scripts/build-all.ts win32-x64

      - name: Smoke test (linux-x64)
        run: ./dist/aurict-linux-x64 --version

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-non-macos
          path: |
            dist/aurict-linux-x64
            dist/aurict-linux-arm64
            dist/aurict-win32-x64.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build native binary
        run: bun run scripts/build-all.ts ${{ matrix.target }}

      - name: Sign and verify binary
        run: |
          binary="dist/aurict-${{ matrix.target }}"
          codesign --force --sign - "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          "$binary" --version

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/aurict-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: Publish verified binaries
    needs: [build-non-macos, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Download verified binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Populate platform packages
        run: |
          chmod 755 dist/aurict-linux-x64 dist/aurict-linux-arm64 dist/aurict-darwin-x64 dist/aurict-darwin-arm64
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            mkdir -p "packages/cli-$target/bin"
            cp "dist/aurict-$target" "packages/cli-$target/bin/aurict"
            chmod 755 "packages/cli-$target/bin/aurict"
          done
          mkdir -p packages/cli-win32-x64/bin
          cp dist/aurict-win32-x64.exe packages/cli-win32-x64/bin/aurict.exe

      - name: Create release checksum manifest
        run: |
          cd dist
          sha256sum aurict-linux-x64 aurict-linux-arm64 aurict-darwin-x64 aurict-darwin-arm64 aurict-win32-x64.exe > checksums.txt

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        env:
          # Passed through env, never interpolated into the script, and validated as semver.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'; then
            echo "Version '$VERSION' is not a valid semver string." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version $VERSION"
          VERSION="$VERSION" bun -e '
            const version = process.env.VERSION
            const pkgs = ["aurict", "cli", "cli-linux-x64", "cli-linux-arm64", "cli-darwin-x64", "cli-darwin-arm64", "cli-win32-x64"]
            for (const name of pkgs) {
              const path = `packages/${name}/package.json`
              const pkg = await Bun.file(path).json()
              pkg.version = version
              if ((name === "aurict" || name === "cli") && pkg.optionalDependencies) {
                for (const dep of Object.keys(pkg.optionalDependencies)) pkg.optionalDependencies[dep] = version
              }
              await Bun.write(path, JSON.stringify(pkg, null, 2) + "\n")
            }
          '

      - name: Verify release version contract
        run: bun run check:version -- --binary dist/aurict-linux-x64

      - name: Publish platform packages
        run: |
          for pkg in cli-linux-x64 cli-linux-arm64 cli-darwin-x64 cli-darwin-arm64 cli-win32-x64; do
            echo "Publishing @aurict/$pkg..."
            cd packages/$pkg
            npm publish --access public
            cd ../..
            sleep 5
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Give npm registry time to fully index the platform packages
      # before the wrapper package resolves its optionalDependencies.
      - name: Wait for npm registry
        run: sleep 30

      - name: Publish main package (with retry)
        run: |
          cd packages/aurict
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            npm publish --access public && break
            if [ $attempt -lt 3 ]; then
              echo "Publish failed, retrying in 30s..."
              sleep 30
            else
              echo "All attempts failed."
              exit 1
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/aurict-linux-x64
            dist/aurict-linux-arm64
            dist/aurict-darwin-x64
            dist/aurict-darwin-arm64
            dist/aurict-win32-x64.exe
            dist/checksums.txt
          generate_release_notes: true
