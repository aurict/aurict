name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.3)"
        required: true
        default: "1.0.3"

jobs:
  build-non-macos:
    name: Build non-macOS binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build non-macOS binaries
        run: |
          bun run scripts/build-all.ts linux-x64
          bun run scripts/build-all.ts linux-arm64
          bun run scripts/build-all.ts win32-x64

      - name: Smoke test (linux-x64)
        run: ./dist/aurict-linux-x64 --version

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-non-macos
          path: |
            dist/aurict-linux-x64
            dist/aurict-linux-arm64
            dist/aurict-win32-x64.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build native binary
        run: bun run scripts/build-all.ts ${{ matrix.target }}

      - name: Sign and verify binary
        run: |
          binary="dist/aurict-${{ matrix.target }}"
          codesign --force --sign - "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          "$binary" --version

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/aurict-${{ matrix.target }}
          if-no-files-found: error

  publish:
    name: Publish verified binaries
    needs: [build-non-macos, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download verified binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Populate platform packages
        run: |
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            mkdir -p "packages/cli-$target/bin"
            cp "dist/aurict-$target" "packages/cli-$target/bin/aurict"
            chmod 755 "packages/cli-$target/bin/aurict"
          done
          mkdir -p packages/cli-win32-x64/bin
          cp dist/aurict-win32-x64.exe packages/cli-win32-x64/bin/aurict.exe

      - name: Create release checksum manifest
        run: |
          cd dist
          sha256sum aurict-linux-x64 aurict-linux-arm64 aurict-darwin-x64 aurict-darwin-arm64 aurict-win32-x64.exe > checksums.txt

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Publishing version $VERSION"
          for pkg in packages/aurict packages/cli packages/cli-linux-x64 packages/cli-linux-arm64 packages/cli-darwin-x64 packages/cli-darwin-arm64 packages/cli-win32-x64; do
            bun x json -I -f $pkg/package.json -e "this.version='$VERSION'"
          done
          for pkg in packages/aurict packages/cli; do
            bun x json -I -f $pkg/package.json -e "
              Object.keys(this.optionalDependencies || {}).forEach(k => {
                this.optionalDependencies[k] = '$VERSION'
              })
            "
          done

      - name: Verify release version contract
        run: bun run check:version -- --binary dist/aurict-linux-x64

      - name: Publish platform packages
        run: |
          for pkg in cli-linux-x64 cli-linux-arm64 cli-darwin-x64 cli-darwin-arm64 cli-win32-x64; do
            echo "Publishing @aurict/$pkg..."
            cd packages/$pkg
            npm publish --access public
            cd ../..
            sleep 5
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Give npm registry time to fully index the platform packages
      # before the wrapper package resolves its optionalDependencies.
      - name: Wait for npm registry
        run: sleep 30

      - name: Publish main package (with retry)
        run: |
          cd packages/aurict
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            npm publish --access public && break
            if [ $attempt -lt 3 ]; then
              echo "Publish failed, retrying in 30s..."
              sleep 30
            else
              echo "All attempts failed."
              exit 1
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aurict-linux-x64
            dist/aurict-linux-arm64
            dist/aurict-darwin-x64
            dist/aurict-darwin-arm64
            dist/aurict-win32-x64.exe
            dist/checksums.txt
          generate_release_notes: true
