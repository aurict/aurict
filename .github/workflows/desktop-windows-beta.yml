name: Hoprel Desktop Beta Release

on:
  push:
    tags:
      - 'desktop-beta-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-desktop:
    name: Test desktop release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint desktop
        run: bun run --cwd apps/desktop lint

      - name: Test desktop
        run: bun run --cwd apps/desktop test

  build-self-signed-beta:
    name: Build self-signed Windows beta
    needs: test-desktop
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      AURICT_SIDECAR_TARGET: bun-windows-x64
      AURICT_WINDOWS_SIGNING: self-signed

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Squirrel archiver
        shell: pwsh
        run: |
          Push-Location node_modules/electron-winstaller
          try {
            & node ./script/select-7z-arch.js
            if ($LASTEXITCODE -ne 0) {
              throw "electron-winstaller could not select its host 7-Zip binary."
            }
          } finally {
            Pop-Location
          }

      - name: Verify Squirrel archiver
        shell: pwsh
        run: |
          $archiver = 'node_modules/electron-winstaller/vendor/7z.exe'
          if (-not (Test-Path -LiteralPath $archiver -PathType Leaf)) {
            throw "Squirrel requires $archiver after electron-winstaller setup."
          }

      - name: Generate ephemeral beta certificate
        shell: pwsh
        run: pwsh -File scripts/prepare-self-signed-windows-certificate.ps1

      - name: Build self-signed Squirrel installer
        run: bun run --cwd apps/desktop make

      - name: Verify beta signatures
        shell: pwsh
        run: |
          & ./scripts/verify-windows-signatures.ps1 `
            -Mode self-signed `
            -ExpectedCertificateThumbprint $env:WINDOWS_CERTIFICATE_THUMBPRINT `
            -Path @(
              'apps/desktop/out/Hoprel-win32-x64',
              'apps/desktop/out/make/squirrel.windows/x64'
            )

      - name: Prepare Windows website download files
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem 'apps/desktop/out/make/squirrel.windows/x64' -Filter '*Setup.exe' -File)
          if ($installer.Count -ne 1) {
            throw "Expected exactly one Setup.exe, found $($installer.Count)."
          }
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null
          Copy-Item -LiteralPath $installer[0].FullName -Destination artifacts/windows/Hoprel-Beta-Setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath artifacts/windows/Hoprel-Beta-Setup.exe).Hash.ToLowerInvariant()
          Set-Content -LiteralPath artifacts/windows/Hoprel-Beta-Setup.exe.sha256 -Value "$hash  Hoprel-Beta-Setup.exe" -NoNewline

      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoprel-windows-beta
          if-no-files-found: error
          path: artifacts/windows/*

  build-debian-beta:
    name: Build Debian desktop beta
    needs: test-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AURICT_SIDECAR_TARGET: bun-linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Debian package
        run: bun run --cwd apps/desktop make -- --targets @electron-forge/maker-deb

      - name: Prepare Debian website download files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find apps/desktop/out/make -name '*.deb' -type f)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one Debian package, found ${#packages[@]}." >&2
            exit 1
          fi
          mkdir -p artifacts/debian
          cp "${packages[0]}" artifacts/debian/Hoprel-Beta-amd64.deb
          sha256sum artifacts/debian/Hoprel-Beta-amd64.deb > artifacts/debian/Hoprel-Beta-amd64.deb.sha256

      - name: Upload Debian beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoprel-debian-beta
          if-no-files-found: error
          path: artifacts/debian/*

  build-macos-beta:
    name: Build signed macOS ${{ matrix.architecture }} desktop beta
    needs: test-desktop
    environment: macos-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: macos-15-intel
            sidecar_target: bun-darwin-x64
            mach_architecture: x86_64
          - architecture: arm64
            runner: macos-14
            sidecar_target: bun-darwin-arm64
            mach_architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      AURICT_SIDECAR_TARGET: ${{ matrix.sidecar_target }}
      AURICT_MACOS_SIGNING: developer-id
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js for Electron Forge
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate macOS release credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_APP_SPECIFIC_PASSWORD APPLE_ID APPLE_TEAM_ID MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing macOS release secret::$name must be configured before publishing a macOS build."
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/aurict-developer-id.p12"
          keychain_path="$RUNNER_TEMP/aurict-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode --output "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          identity_count="$(security find-identity -v -p codesigning "$keychain_path" | grep -c 'Developer ID Application:' || true)"
          if [ "$identity_count" -ne 1 ]; then
            echo "::error title=Invalid macOS signing certificate::Expected exactly one Developer ID Application identity, found $identity_count."
            exit 1
          fi

          echo "APPLE_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS ZIP
        run: bun run --cwd apps/desktop make -- --targets @electron-forge/maker-zip

      - name: Verify and prepare macOS website download files
        shell: bash
        run: |
          set -euo pipefail
          package_count="$(find apps/desktop/out/make -name '*.zip' -type f | wc -l | tr -d ' ')"
          if [ "$package_count" -ne 1 ]; then
            echo "Expected exactly one macOS ZIP, found $package_count." >&2
            exit 1
          fi
          package="$(find apps/desktop/out/make -name '*.zip' -type f -print -quit)"
          verification_dir="$RUNNER_TEMP/hoprel-macos-${{ matrix.architecture }}"
          mkdir -p "$verification_dir"
          ditto -x -k "$package" "$verification_dir"
          app_path="$verification_dir/Hoprel.app"
          main_executable="$app_path/Contents/MacOS/hoprel"
          sidecar_executable="$app_path/Contents/Resources/aurict-sidecar"

          test -d "$app_path"
          test -x "$main_executable"
          test -x "$sidecar_executable"
          test "$(lipo -archs "$main_executable")" = "${{ matrix.mach_architecture }}"
          test "$(lipo -archs "$sidecar_executable")" = "${{ matrix.mach_architecture }}"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          signature_details="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
          printf '%s\n' "$signature_details"
          grep -q '^Authority=Developer ID Application:' <<< "$signature_details"
          grep -q "^TeamIdentifier=$APPLE_TEAM_ID$" <<< "$signature_details"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          mkdir -p artifacts/macos
          asset="Hoprel-Beta-macos-${{ matrix.architecture }}.zip"
          cp "$package" "artifacts/macos/$asset"
          (
            cd artifacts/macos
            shasum -a 256 "$asset" > "$asset.sha256"
          )

      - name: Upload macOS beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoprel-macos-${{ matrix.architecture }}-beta
          if-no-files-found: error
          path: artifacts/macos/*

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${APPLE_SIGNING_KEYCHAIN:-}" ] && [ -f "$APPLE_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN"
          fi

  publish-beta-release:
    name: Publish desktop beta release
    if: github.ref_type == 'tag'
    needs: [build-self-signed-beta, build-debian-beta, build-macos-beta]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows beta artifact
        uses: actions/download-artifact@v4
        with:
          name: hoprel-windows-beta
          path: artifacts

      - name: Download Debian beta artifact
        uses: actions/download-artifact@v4
        with:
          name: hoprel-debian-beta
          path: artifacts

      - name: Download macOS Intel beta artifact
        uses: actions/download-artifact@v4
        with:
          name: hoprel-macos-x64-beta
          path: artifacts

      - name: Download macOS Apple Silicon beta artifact
        uses: actions/download-artifact@v4
        with:
          name: hoprel-macos-arm64-beta
          path: artifacts

      - name: Publish GitHub beta release
        uses: softprops/action-gh-release@v2
        with:
          name: Hoprel by Aurict Beta ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
