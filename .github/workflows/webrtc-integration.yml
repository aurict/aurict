name: WebRTC Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-webrtc:
    name: Controlled real WebRTC transport
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AURICT_RUN_WEBRTC_INTEGRATION: "1"
      AURICT_WEBRTC_TEST_STUN_URL: ${{ vars.AURICT_WEBRTC_TEST_STUN_URL }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate controlled STUN endpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AURICT_WEBRTC_TEST_STUN_URL"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run real WebRTC transport test
        run: bun run test:integration
