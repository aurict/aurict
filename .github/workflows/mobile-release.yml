name: Mobile Android Release

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "Android artifact to build"
        required: true
        default: "both"
        type: choice
        options:
          - apk
          - aab
          - both

permissions:
  contents: read

concurrency:
  group: mobile-android-release
  cancel-in-progress: true

jobs:
  android-release:
    name: Build Android release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Restore Android signing and Firebase files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/android/app
          printf '%s' "${ANDROID_KEY_PROPERTIES_B64}" | base64 --decode > mobile/android/key.properties
          printf '%s' "${ANDROID_KEYSTORE_B64}" | base64 --decode > mobile/android/app/mindgrid-release.keystore
          printf '%s' "${FIREBASE_GOOGLE_SERVICES_JSON_B64}" | base64 --decode > mobile/android/app/google-services.json
          test -s mobile/android/key.properties
          test -s mobile/android/app/mindgrid-release.keystore
          test -s mobile/android/app/google-services.json
        env:
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        if: ${{ inputs.artifact == 'apk' || inputs.artifact == 'both' }}
        working-directory: mobile
        run: flutter build apk --release

      - name: Verify APK signature
        if: ${{ inputs.artifact == 'apk' || inputs.artifact == 'both' }}
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Build release App Bundle
        if: ${{ inputs.artifact == 'aab' || inputs.artifact == 'both' }}
        working-directory: mobile
        run: flutter build appbundle --release

      - name: Upload APK artifact
        if: ${{ inputs.artifact == 'apk' || inputs.artifact == 'both' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aurict-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload App Bundle artifact
        if: ${{ inputs.artifact == 'aab' || inputs.artifact == 'both' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aurict-android-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
